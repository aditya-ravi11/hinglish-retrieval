name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Form assignment tests (Apps Script logic)
        run: node --test tests/test_gas_assign.mjs tests/test_gas_code.mjs
      - name: Leakage check (committed manifests)
        run: python scripts/check_leakage.py
