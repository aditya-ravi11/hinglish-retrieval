[project]
name = "hinglish-retrieval"
version = "0.1.0"
description = "Human-written Hinglish retrieval benchmark and a small script-invariant embedding model"
requires-python = ">=3.12"
dependencies = [
    "huggingface_hub>=1.0",
    "datasets>=4.0",
    "numpy",
    "pandas",
    "pyarrow",
    "openpyxl",
    "bm25s",
    "indic-transliteration",
]

[project.optional-dependencies]
form = ["gradio>=6.0"]
models = ["torch", "sentence-transformers", "transformers"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "form/tests"]
pythonpath = ["src", "form"]
